[package]
name = "seakarr"
version = "0.23.2"
edition = "2021"
# Not published to crates.io — verified against the registry API and the sparse
# index, neither of which has this crate. Declared here so `cargo publish`
# cannot push it by accident, and so `cargo deny` treats it as a private crate
# instead of reporting the absent `license` field. Choosing that licence is the
# author's decision, which is why no `license` value is asserted here.
publish = false

# The vendored soulseek-rs-lib is a workspace member so `cargo test` at the
# root runs its behavioral regression tests (peer cap, FIFO eviction, zombie
# eviction) — a patch-only dependency would build it but never test it.
[workspace]
members = [".", "vendor/soulseek-rs-lib"]
default-members = [".", "vendor/soulseek-rs-lib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
soulseek-rs-lib = { path = "vendor/soulseek-rs-lib" }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
lofty = "0.21"
walkdir = "2"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
unicode-normalization = "0.1"
regex = "1"
sha2 = "0.11.0"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
wiremock = "0.6"
libc = "0.2"
