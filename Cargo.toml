[package]
name = "seakarr"
version = "0.8.7"
edition = "2021"

# The vendored soulseek-rs-lib is a workspace member so `cargo test` at the
# root runs its behavioral regression tests (peer cap, FIFO eviction, zombie
# eviction) — a patch-only dependency would build it but never test it.
[workspace]
members = [".", "vendor/soulseek-rs-lib"]
default-members = [".", "vendor/soulseek-rs-lib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
config = "0.14"
soulseek-rs-lib = { path = "vendor/soulseek-rs-lib" }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
lofty = "0.21"
walkdir = "2"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.17"
unicode-normalization = "0.1"
regex = "1"

[dev-dependencies]
rstest = "0.22"
tempfile = "3"
assert_cmd = "2"
wiremock = "0.6"
libc = "0.2"
