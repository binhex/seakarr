# cargo-deny configuration — dependency policy for seakarr.
#
# Run with: cargo deny check
#
# Generated by `cargo deny init` (cargo-deny 0.20.2) and reduced to the sections
# this project actually pins. Everything omitted keeps the upstream default
# documented in the `cargo deny init` template.
#
# Note that in cargo-deny 0.20 the `[advisories]` section exposes no
# `unmaintained`/`yanked` lint level, so accepting an unmaintained-but-Not
# vulnerable crate has to be an explicit `ignore` entry with a reason.

[advisories]
# Only unmaintained-crate advisories are accepted here. Any advisory that
# describes an actual vulnerability is deliberately NOT ignored and will fail
# the check, and `cargo deny` still prints a note for every ignored entry.
ignore = [
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is unmaintained. It is pulled in transitively by indicatif for the progress bar and no advisory describes a vulnerability in it." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained and archived. It is pulled in transitively by lofty for audio tag parsing, seakarr calls no paste macro directly, and cargo-deny reports no safe upgrade path." },
]

[licenses]
# Every licence present in the dependency graph, verified against
# `cargo deny list`. Only permissive licences are allowed: r-efi appears as
# LGPL-2.1-or-later in the graph but is dual-licensed and resolves through MIT,
# so no copyleft licence needs to be permitted.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The seakarr workspace crate carries no `license` field in Cargo.toml, so it has
# no SPDX expression to check. This policy governs third-party dependencies; the
# crate's own licence is its author's decision. Cargo.toml declares
# `publish = false`, which is what makes cargo-deny treat it as private here.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
