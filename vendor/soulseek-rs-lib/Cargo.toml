[package]
name = "soulseek-rs-lib"
version = "14.1.0"
authors = ["Michel de Graaf"]
edition = "2024"
license = "MIT"
repository = "https://github.com/michel/soulseek-rs"
homepage = "https://re-invention.nl/soulseek-rs/"
description = "Library for Soulseek protocol implementation in Rust"
keywords = ["soulseek", "p2p", "protocol", "file-sharing"]
categories = ["network-programming"]

[lib]
name = "soulseek_rs"
path = "src/lib.rs"

[dependencies]

[target."cfg(unix)".dependencies.libc]
version = "0.2.189"

[lints.clippy]
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
